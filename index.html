<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>경기도고양교육지원청 웹책자</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
/* 페이퍼로지 (Paperlogy) 웹폰트 */
@font-face{font-family:'Paperlogy';src:url('https://cdn.jsdelivr.net/gh/projectnoonnu/2408-3@1.0/Paperlogy-3Light.woff2') format('woff2');font-weight:300;font-display:swap}
@font-face{font-family:'Paperlogy';src:url('https://cdn.jsdelivr.net/gh/projectnoonnu/2408-3@1.0/Paperlogy-4Regular.woff2') format('woff2');font-weight:400;font-display:swap}
@font-face{font-family:'Paperlogy';src:url('https://cdn.jsdelivr.net/gh/projectnoonnu/2408-3@1.0/Paperlogy-5Medium.woff2') format('woff2');font-weight:500;font-display:swap}
@font-face{font-family:'Paperlogy';src:url('https://cdn.jsdelivr.net/gh/projectnoonnu/2408-3@1.0/Paperlogy-6SemiBold.woff2') format('woff2');font-weight:600;font-display:swap}
@font-face{font-family:'Paperlogy';src:url('https://cdn.jsdelivr.net/gh/projectnoonnu/2408-3@1.0/Paperlogy-7Bold.woff2') format('woff2');font-weight:700;font-display:swap}
@font-face{font-family:'Paperlogy';src:url('https://cdn.jsdelivr.net/gh/projectnoonnu/2408-3@1.0/Paperlogy-8ExtraBold.woff2') format('woff2');font-weight:800;font-display:swap}
:root{
  --bg:#ffffff; --bg2:#f1f4fa; --ink:#141a2b; --mut:#6b7385; --line:#e3e7ef; --blue:#cddbfb; --blue2:#e6eeff;
  --accent:#2f55d4; --navy:#23305a; --teal:#2a9d8f; --mustard:#f2b134;
  --serif:'Paperlogy','IBM Plex Sans KR',system-ui,sans-serif; --sans:'Paperlogy','IBM Plex Sans KR',system-ui,sans-serif;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);word-break:keep-all;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
.wrap{width:min(1240px,100% - 48px);margin:0 auto}

/* header */
.top{position:sticky;top:0;z-index:20;background:#f4efe6e6;backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:16px;height:64px}
.logo{display:flex;align-items:center;gap:10px;font-family:var(--serif);font-weight:700;font-size:19px}
.logo i{width:26px;height:26px;border-radius:50%;background:conic-gradient(var(--accent) 0 33%,var(--mustard) 0 66%,var(--teal) 0);position:relative}
.logo i::after{content:"";position:absolute;inset:8px;border-radius:50%;background:var(--bg)}
.logo small{font-family:var(--sans);font-weight:400;font-size:12px;color:var(--mut);margin-left:4px}
.top nav{margin-left:auto;display:flex;gap:6px}
.top nav a{font-size:14px;padding:8px 14px;border-radius:99px;color:var(--mut)}
.top nav a:hover{color:var(--ink);background:var(--bg2)}

/* hero */
.hero{padding:80px 0 64px;background:radial-gradient(circle at 85% 20%,var(--blue2),transparent 55%),var(--blue);color:var(--ink);position:relative;overflow:hidden}
.hero::before{content:"";position:absolute;width:520px;height:520px;border-radius:50%;border:1px solid #3a5bd022;left:-180px;bottom:-300px}
.hero::after{content:"";position:absolute;width:300px;height:300px;border-radius:50%;border:1px solid #3a5bd01a;left:-80px;bottom:-200px}
.hero .wrap{position:relative;z-index:1}
.hero .eyebrow{color:#3a5bd0}
.hero .wrap{display:grid;grid-template-columns:1.1fr .9fr;gap:56px;align-items:center}
.eyebrow{font-size:12px;letter-spacing:.24em;font-weight:600;color:var(--accent);text-transform:uppercase}
.eyebrow::before{content:"";display:inline-block;width:28px;height:2px;background:currentColor;vertical-align:middle;margin-right:10px}
.hero h1{font-family:var(--serif);font-weight:800;font-size:clamp(36px,5.2vw,64px);line-height:1.18;margin:18px 0 20px;letter-spacing:-.02em}
.hero h1 em{font-style:normal;color:#2f55d4}
.hero p{font-size:17px;line-height:1.75;color:#4a5577;max-width:30em;margin:0}
.stats{display:flex;gap:36px;margin-top:34px}
.stats div b{display:block;font-family:var(--serif);font-size:30px}
.stats div span{font-size:13px;color:var(--mut)}

/* featured */
.feat{position:relative;display:flex;justify-content:center;align-items:flex-end;min-height:420px}
.feat .halo{position:absolute;width:88%;aspect-ratio:1;border-radius:50%;background:#ffffff8c;bottom:0;box-shadow:inset 0 0 0 1px #ffffff}
.feat-book{position:relative;width:min(290px,70%);transform:rotate(-4deg);transition:transform .4s}
.feat-book:hover{transform:rotate(0)}
.feat-tag{position:absolute;top:-14px;right:-18px;z-index:3;background:#141a2b;color:#fff;font-size:12px;font-weight:600;padding:8px 14px;border-radius:99px;transform:rotate(6deg)}

/* toolbar */
.tools{position:sticky;top:64px;z-index:10;background:var(--bg);padding:18px 0 16px;border-bottom:1px solid var(--line)}
.tools .wrap{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.chips{display:flex;gap:8px;flex-wrap:wrap;flex:1}
.chip{white-space:nowrap;flex:none;padding:9px 16px;border-radius:99px;border:1px solid var(--line);font-size:14px;color:#55504a;transition:.15s;background:#fffaf2}
.chip:hover{border-color:var(--ink)}
.chip.on{background:var(--ink);border-color:var(--ink);color:#fff}
.chip small{opacity:.6;margin-left:4px;font-size:12px}
.search{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:99px;padding:0 14px;background:#fffaf2;height:42px;min-width:240px}
.search:focus-within{border-color:var(--ink)}
.search svg{width:17px;height:17px;color:var(--mut);flex:none}
.search input{border:0;outline:0;background:none;font:inherit;font-size:14px;width:100%;color:var(--ink)}
select.sort{height:42px;border:1px solid var(--line);border-radius:99px;padding:0 14px;background:#fffaf2;font:inherit;font-size:14px;color:var(--ink)}

/* shelf */
.shelf-sec{padding:44px 0 90px}
.sec-head{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:28px}
.sec-head h2{font-family:var(--serif);font-size:28px;margin:0}
.sec-head span{font-size:14px;color:var(--mut)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:56px 36px}
.card{display:block;position:relative;animation:rise .5s both}
@keyframes rise{from{opacity:0;transform:translateY(14px)}}
.card .stand{position:relative;padding:0 6% 0;}
.card .stand::after{content:"";position:absolute;left:-8%;right:-8%;bottom:-14px;height:14px;background:linear-gradient(#e9edf4,#d9dfea);border-radius:3px;box-shadow:0 8px 14px -6px #0003}
.book{position:relative;aspect-ratio:1/1.414;perspective:1400px;transform-style:preserve-3d;
  transition:transform .45s cubic-bezier(.3,.7,.2,1)}
/* 안쪽 페이지 (종이 묶음) */
.book .inner{position:absolute;inset:0;border-radius:2px 6px 6px 2px;background:#fff;overflow:hidden;
  box-shadow:0 1px 1px #0002,0 10px 22px -8px #0005,inset 0 0 0 1px #00000010;transition:box-shadow .45s}
.book .inner::after{content:"";position:absolute;top:2%;bottom:2%;right:0;width:5px;z-index:2;
  background:repeating-linear-gradient(90deg,#e7e9ee 0 1px,#fff 1px 2px);box-shadow:-1px 0 0 #0000000d}
.book .inner img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.95}
.book .inner .lines{position:absolute;inset:14% 12% 14% 22%;background:repeating-linear-gradient(#0000 0 14px,#e6e9f0 14px 15px)}
.book .inner .lines::before{content:"";position:absolute;left:0;top:-9%;width:55%;height:7px;border-radius:4px;background:var(--accent);opacity:.5}
/* 표지 */
.book .cv{position:absolute;inset:0;z-index:3;border-radius:3px 7px 7px 3px;overflow:hidden;background:#ddd;
  transform-origin:left center;transition:transform .7s cubic-bezier(.3,.7,.2,1),box-shadow .7s;
  box-shadow:0 1px 1px #0002,0 10px 22px -8px #0006,inset 0 0 0 1px #0000000d;backface-visibility:hidden}
.book .cv::before{content:"";position:absolute;left:0;top:0;bottom:0;width:7%;z-index:4;
  background:linear-gradient(90deg,#00000040,#ffffff30 40%,#0000001a 70%,transparent)}
.book .cv::after{content:"";position:absolute;inset:0;z-index:4;background:linear-gradient(115deg,#ffffff26,transparent 40%);pointer-events:none;transition:background .7s}
.book .cv img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:2;background:#fff}
.card:hover .book,.card:focus-visible .book{transform:translateY(-10px)}
.card:hover .book .cv,.card:focus-visible .book .cv{transform:rotateY(-66deg);box-shadow:18px 10px 34px -8px #0004}
.card:hover .book .cv::after,.card:focus-visible .book .cv::after{background:linear-gradient(90deg,transparent 30%,#0000002e)}
.card:hover .book .inner{box-shadow:0 1px 1px #0002,0 26px 40px -12px #0006,inset 0 0 0 1px #00000010}
.go{position:absolute;right:8%;bottom:7%;z-index:3;opacity:0;transition:opacity .3s .25s,transform .3s .25s;transform:translateY(6px)}
.go span{background:var(--ink);color:#fff;font-size:12.5px;font-weight:600;padding:9px 14px;border-radius:99px;display:flex;gap:6px;align-items:center;box-shadow:0 6px 14px -4px #0006}
.go svg{width:13px;height:13px}
.card:hover .go,.card:focus-visible .go{opacity:1;transform:none}
.card:focus-visible{outline:none}
.card:focus-visible .book{outline:3px solid var(--accent);outline-offset:6px;border-radius:6px}
.badge{display:inline-block;background:var(--accent);color:#fff;font-size:10.5px;font-weight:700;letter-spacing:.08em;padding:2px 8px;border-radius:99px;margin-right:6px;vertical-align:1px}
.meta{margin-top:30px}
.meta .cat{font-size:12px;color:var(--accent);font-weight:600;letter-spacing:.04em}
.meta h3{font-family:var(--serif);font-size:18px;line-height:1.4;margin:6px 0 4px}
.meta p{margin:0;font-size:13.5px;color:var(--mut);line-height:1.6;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.empty{grid-column:1/-1;text-align:center;padding:70px 0;color:var(--mut)}

/* generated cover */
.gc{position:absolute;inset:0;container-type:inline-size;color:#fff}
.gc svg{position:absolute;inset:0;width:100%;height:100%}
.gc .t{position:absolute;left:10cqw;right:10cqw;bottom:12cqw;z-index:2}
.gc .v{position:absolute;left:10cqw;right:10cqw;top:9cqw;display:flex;justify-content:space-between;font-size:5.2cqw;letter-spacing:.16em;font-weight:600;z-index:2;opacity:.9}
.gc h4{font-family:var(--serif);font-size:11.5cqw;line-height:1.22;margin:0 0 3cqw;letter-spacing:-.01em}
.gc small{font-size:5.6cqw;opacity:.85;display:block}

footer{background:#141a2b;color:#b9c1d6;padding:44px 0}
footer .wrap{display:flex;gap:24px;justify-content:space-between;align-items:center;flex-wrap:wrap}
footer .fl{font-size:13px;line-height:1.8}
footer .fl b{color:#fff;font-family:var(--serif);font-size:17px;display:block;margin-bottom:4px}
footer .links{display:flex;gap:10px}
footer .links a{display:flex;align-items:center;gap:8px;border:1px solid #ffffff2a;border-radius:99px;padding:9px 16px;font-size:13px;color:#fff}
footer .links a:hover{background:#ffffff14}
footer .links svg{width:16px;height:16px}

@media (max-width:860px){
  .hero{padding:40px 0 20px}
  .hero .wrap{grid-template-columns:1fr;gap:20px}
  .feat{min-height:340px;order:-1}
  .top nav{display:none}
  .tools{top:64px}
  .search{min-width:0;flex:1}
  .tools{padding:12px 0}
  .tools .wrap{gap:10px}
  .chips{flex:0 0 100%;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;margin:0 -16px;padding:0 16px}
  .chips::-webkit-scrollbar{display:none}
  select.sort{padding:0 10px}
}
@media (max-width:520px){
  .wrap{width:calc(100% - 32px)}
  .grid{grid-template-columns:1fr 1fr;gap:44px 20px}
  .stats{gap:24px}
  .meta h3{font-size:16px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>


<section class="hero" id="top"><div class="wrap">
  <div>
    <div class="eyebrow">Digital Library</div>
    <h1>교실의 이야기를<br><em>한 서가</em>에 모았습니다</h1>
    <p>수업 사례집, 교육과정 안내서, 계간 웹진까지. 표지를 누르면 e북이 새 창으로 열립니다.</p>
  </div>
  <div class="feat" id="feat"></div>
</div></section>


<section class="shelf-sec" id="shelf"><div class="wrap">
  <div class="sec-head"><h2 id="secTitle">전체 책자</h2><span id="count"></span></div>
  <div class="grid" id="grid"></div>
</div></section>

<footer id="footer"><div class="wrap">
  <div class="fl"><b>경기도고양교육지원청</b>(10409) 경기도 고양시 일산동구 중앙로 1296<br>대표전화 031-900-2800<br>Copyright © Goyang Office of Education. All rights reserved.</div>

    <a href="https://www.instagram.com/goyangeducation/" target="_blank" rel="noopener"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r=".8" fill="currentColor"/></svg>인스타그램</a>
  </div>
</div></footer>

<script>
/* =====================================================================
   ✏️ 책자 목록 — 여기만 고치면 됩니다
   - title   : 책자 제목
   - desc    : 한두 줄 소개
   - cat     : 분류 (같은 이름끼리 필터 버튼으로 묶여요)
   - date    : 발간일 'YYYY-MM' (최신순 정렬·NEW 표시에 사용)
   - link    : 클릭하면 열릴 e북 주소
   - cover   : 표지 이미지 주소 (비워 두면 자동으로 표지를 그려 줘요)
   - inside  : 마우스를 올려 표지가 열릴 때 보이는 안쪽 페이지 이미지 (선택)
   - color   : 자동 표지 색 [바탕색, 포인트색]
   - featured: true 인 책자 하나가 상단에 크게 나와요 (없으면 가장 최신 책자)
   ※ 사이트에는 이 목록에 적힌 순서대로 보여요
   ===================================================================== */
const BOOKS = [
  {title:'2025 G.R.O.W. 디지털 기반 수업 혁신 사례집', desc:'하이러닝 수업 실천, 학생 성장의 길을 열다 — 고양미래교육연구회 15개 수업 사례', cat:'수업 사례집', date:'2025-12', link:'ebook/grow-2025/index.html', cover:'covers/grow-2025.jpg', inside:'covers/grow-2025-inside.jpg', color:['#6b4fbb','#e9e2ff'], featured:true},
  {title:'2026 학교 교육과정 안내서', desc:'학부모와 함께 보는 올해의 교육과정 한눈에 보기', cat:'안내서', date:'2026-03', link:'https://example.com/ebook/curriculum-2026', cover:'', color:['#e2573a','#fff1d6']},
  {title:'온새미 2026 여름호', desc:'함께 설계하는 프로젝트 수업, 학생이 주인이 되는 교실', cat:'계간 웹진', date:'2026-07', link:'https://example.com/ebook/onsaemi-2026-summer', cover:'', color:['#3c4f2e','#f2b134']},
  {title:'마을과 함께하는 배움 지도', desc:'우리 동네 배움터 40곳과 체험 프로그램 소개', cat:'안내서', date:'2026-05', link:'https://example.com/ebook/village-map', cover:'', color:['#f2b134','#23305a']},
  {title:'질문으로 여는 과학 수업', desc:'짝 토론·예측 활동을 활용한 중학교 과학 수업 자료', cat:'수업 사례집', date:'2026-04', link:'https://example.com/ebook/science-questions', cover:'', color:['#5b3a6e','#ffb199']},
  {title:'온새미 2026 봄호', desc:'새 학기 첫 주, 관계를 만드는 열 가지 활동', cat:'계간 웹진', date:'2026-04', link:'https://example.com/ebook/onsaemi-2026-spring', cover:'', color:['#c94f6d','#fde3ea']},
  {title:'교사 배움 모임 운영 가이드', desc:'전문적 학습공동체를 처음 꾸리는 학교를 위한 안내', cat:'연수 자료', date:'2026-02', link:'https://example.com/ebook/teacher-community', cover:'', color:['#1f6f8b','#c8f0ea']},
  {title:'2025 배움 성장 보고서', desc:'한 해 동안의 정책 실행과 학교 현장의 변화', cat:'보고서', date:'2025-12', link:'https://example.com/ebook/report-2025', cover:'', color:['#2b2a28','#e2573a']},
  {title:'온새미 2025 겨울호', desc:'평가를 다시 생각하다 — 성장을 기록하는 방법', cat:'계간 웹진', date:'2025-12', link:'https://example.com/ebook/onsaemi-2025-winter', cover:'', color:['#3a5a8c','#dbe8ff']},
  {title:'디지털 시민교육 수업 자료', desc:'초·중학교에서 바로 쓰는 디지털 리터러시 활동지', cat:'연수 자료', date:'2025-10', link:'https://example.com/ebook/digital-citizen', cover:'', color:['#0f766e','#f2b134']},
  {title:'학부모 아카데미 자료집', desc:'자녀와 함께 성장하는 대화법 강의 모음', cat:'안내서', date:'2025-09', link:'https://example.com/ebook/parents-academy', cover:'', color:['#8a5a2b','#fff1d6']},
];
const NEW_MONTHS = 3; // 최근 몇 달 안의 책자에 NEW 표시

/* ================================================================== */
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ym=d=>{const [y,m]=(d||'0-0').split('-').map(Number);return y*12+(m||1)};
const latest=Math.max(...BOOKS.map(b=>ym(b.date)));
const isNew=b=>latest-ym(b.date)<NEW_MONTHS;
let state={cat:'전체',q:'',sort:'order'}; // order = 목록에 적은 순서대로

function patternSVG(b,i){
  const [bg,pt]=b.color||['#23305a','#f2b134']; const v=i%4;
  const shapes=[
    `<circle cx="74" cy="44" r="30" fill="${pt}"/><circle cx="74" cy="44" r="12" fill="${bg}"/><path d="M0 141V100a36 36 0 0 1 72 0v41z" fill="#ffffff22"/>`,
    `<rect x="-10" y="20" width="80" height="80" rx="40" fill="${pt}" transform="rotate(20 30 60)"/><circle cx="80" cy="30" r="10" fill="#ffffff44"/>`,
    `<path d="M0 0h100v62C70 80 30 40 0 62z" fill="${pt}"/><circle cx="24" cy="30" r="8" fill="${bg}"/><circle cx="50" cy="22" r="4" fill="${bg}"/>`,
    `<g fill="${pt}"><rect x="10" y="14" width="22" height="22" rx="3"/><rect x="39" y="14" width="22" height="22" rx="11"/><rect x="68" y="14" width="22" height="22" rx="3" transform="rotate(45 79 25)"/><rect x="10" y="43" width="22" height="22" rx="11"/><rect x="39" y="43" width="22" height="22" rx="3"/></g>`
  ];
  return `<svg viewBox="0 0 100 141" preserveAspectRatio="xMidYMid slice"><rect width="100" height="141" fill="${bg}"/>${shapes[v]}<rect width="100" height="141" fill="url(#fade)"/><defs><linearGradient id="fade" x1="0" y1="0" x2="0" y2="1"><stop offset=".5" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".35"/></linearGradient></defs></svg>`;
}
function genCover(b,i){
  const [y,m]=(b.date||'').split('-');
  return `<div class="gc">${patternSVG(b,i)}<div class="v"><span>${esc(b.cat)}</span><span>${esc(y||'')}${m?'.'+esc(m):''}</span></div><div class="t"><h4>${esc(b.title)}</h4><small>${esc(b.desc).slice(0,28)}${(b.desc||'').length>28?'…':''}</small></div></div>`;
}
function bookHTML(b,i){
  const inside=b.inside?`<img src="${esc(b.inside)}" alt="" loading="lazy" onerror="this.remove()">`:'<div class="lines"></div>';
  return `<div class="book">
    <div class="inner">${inside}
      <div class="go"><span>e북 보기<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M7 17 17 7M8 7h9v9"/></svg></span></div></div>
    <div class="cv">${genCover(b,i)}${b.cover?`<img src="${esc(b.cover)}" alt="${esc(b.title)} 표지" loading="lazy" onerror="this.remove()">`:''}</div>
  </div>`;
}
function renderFeatured(){
  const f=BOOKS.find(b=>b.featured)||[...BOOKS].sort((a,b)=>ym(b.date)-ym(a.date))[0];
  if(!f) return;
  $('#feat').innerHTML=`<div class="halo"></div><a class="card feat-book" href="${esc(f.link)}" target="_blank" rel="noopener" aria-label="${esc(f.title)} e북 열기"><span class="feat-tag">이번 호 ↗</span>${bookHTML(f,BOOKS.indexOf(f))}</a>`;
}
function renderChips(){
  const cats=['전체',...new Set(BOOKS.map(b=>b.cat))];
  $('#chips').innerHTML=cats.map(c=>{const n=c==='전체'?BOOKS.length:BOOKS.filter(b=>b.cat===c).length;
    return `<button class="chip${c===state.cat?' on':''}" data-c="${esc(c)}">${esc(c)}<small>${n}</small></button>`}).join('');
  $('#chips').querySelectorAll('.chip').forEach(el=>el.onclick=()=>{state.cat=el.dataset.c;renderChips();renderGrid()});
}
function renderGrid(){
  const q=state.q.trim().toLowerCase();
  let list=BOOKS.map((b,i)=>({b,i})).filter(({b})=>(state.cat==='전체'||b.cat===state.cat)&&(!q||(b.title+' '+b.desc+' '+b.cat).toLowerCase().includes(q)));
  if(state.sort==='new') list.sort((x,y)=>ym(y.b.date)-ym(x.b.date)||x.i-y.i);
  if(state.sort==='old') list.sort((x,y)=>ym(x.b.date)-ym(y.b.date)||x.i-y.i);
  if(state.sort==='title') list.sort((x,y)=>x.b.title.localeCompare(y.b.title,'ko'));
  $('#secTitle').textContent=state.cat==='전체'?'전체 책자':state.cat;
  $('#count').textContent=`${list.length}권`;
  $('#grid').innerHTML=list.length?list.map(({b,i},k)=>`
    <a class="card" href="${esc(b.link)}" target="_blank" rel="noopener" style="animation-delay:${Math.min(k,12)*40}ms" aria-label="${esc(b.title)} e북 열기 (새 창)">
      <div class="stand">${bookHTML(b,i)}</div>
      <div class="meta"><div class="cat">${isNew(b)?'<span class="badge">NEW</span>':''}${esc(b.cat)} · ${esc((b.date||'').replace('-','.'))}</div><h3>${esc(b.title)}</h3><p>${esc(b.desc)}</p></div>
    </a>`).join(''):`<div class="empty">찾는 책자가 없어요. 다른 검색어를 입력해 보세요.</div>`;
}
renderFeatured(); renderGrid();
</script>
</body>
</html>
